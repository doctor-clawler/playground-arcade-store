name: Deploy PLAY//GROUND to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Build portal and all game sources
        run: |
          npm ci
          npm run build
          npm test
          npm run validate
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload static bundle
        uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
