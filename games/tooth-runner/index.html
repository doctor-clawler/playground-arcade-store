<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>이빨 피하기</title>
    <meta http-equiv="Cache-Control" content="no-store" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="stylesheet" href="./styles.css?v=always-visible-5" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <button id="saveExitButton" class="primary-button">저장하고 나가기</button>
        <div class="hud">
          <span id="moneyLabel">0원</span>
          <span id="statusLabel">로비</span>
        </div>
      </header>

      <section class="game-layout" aria-label="이빨 피하기 게임">
        <div class="stage-wrap">
          <canvas id="game" width="960" height="600" aria-label="게임 화면"></canvas>
          <div id="visualLayer" class="visual-layer" aria-hidden="true">
            <div id="stageMoney" class="stage-money">0원</div>
            <div id="fallbackPlayer" class="fallback-player" style="--x: 36.5; --y: 60"></div>
            <div id="fallbackTooth" class="fallback-tooth" style="--x: 63.5; --y: 60">이빨</div>
            <div id="fallbackCoins" class="fallback-coins">
              <div class="fallback-coin" style="--x: 19.8; --y: 71.7"><span>50</span></div>
              <div class="fallback-coin" style="--x: 50; --y: 71.7"><span>50</span></div>
              <div class="fallback-coin" style="--x: 80.2; --y: 71.7"><span>50</span></div>
            </div>
          </div>
          <div class="controls">
            <button id="startButton" class="action-button">게임 시작</button>
            <button id="attackButton" class="action-button" disabled>공격</button>
          </div>
        </div>

        <aside class="side-actions">
          <button id="shopButton" class="shop-toggle">상점</button>
          <div id="shopPanel" class="shop-panel" hidden>
            <div class="shop-head">
              <strong>상점</strong>
              <button id="closeShopButton" aria-label="상점 닫기">×</button>
            </div>
            <button class="shop-item" data-buy="invincible">
              <span>1 무적</span>
              <span class="shop-item-status">10000원</span>
            </button>
            <button class="shop-item" data-buy="hammer">
              <span>2 이빨을 죽이세요</span>
              <span class="shop-item-status">2000원</span>
            </button>
          </div>
        </aside>
      </section>
    </main>
    <script type="module" src="./src/main.js?v=always-visible-5"></script>
  </body>
</html>
